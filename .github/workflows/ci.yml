name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.27.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            go.sum

      - name: Run tests
        run: go test ./...

      - name: Run tests (strict)
        run: go test -tags strict ./...

      - name: Run vet
        run: go vet ./...

  simd:
    name: simd (experimental)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.27.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            go.sum

      - name: Run tests with GOEXPERIMENT=simd
        env:
          GOEXPERIMENT: simd
        run: go test ./...

      - name: Run vet with GOEXPERIMENT=simd (amd64, arm64)
        env:
          GOEXPERIMENT: simd
        run: |
          GOARCH=amd64 go vet ./...
          GOARCH=arm64 go vet ./...

      - name: Benchmark experimental/simd (informational)
        env:
          GOEXPERIMENT: simd
        run: go test -run '^$' -bench . -benchtime 200ms ./experimental/simd

  excel:
    name: excel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.27.x"

    defaults:
      run:
        working-directory: excel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            excel/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run tests (strict)
        run: go test -tags strict ./...

  examples:
    name: examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.27.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            examples/go.sum

      - name: Build examples
        run: |
          cd examples
          go build ./...

      - name: Run vet
        run: |
          cd examples
          go vet ./...
